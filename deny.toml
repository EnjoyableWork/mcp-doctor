[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
]
confidence-threshold = 0.93
# MCPD-006 reviewed these exact permissive transitive licenses. Keeping them
# crate-scoped prevents an unrelated MIT-0 or Zlib dependency from entering
# without a new review.
exceptions = [
  { allow = ["MIT-0"], crate = "borrow-or-share@0.2.4" },
  { allow = ["Zlib"], crate = "foldhash@0.2.0" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = [
  { crate = "syn@2.0.119", reason = "process-wrap 9.1.0 still uses syn 2 through its futures and Windows process-tree support while the current CLI derive stack uses syn 3; pin this exact reviewed transition until upstream unifies" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
