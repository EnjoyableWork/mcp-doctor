[package]
name = "mcp-doctor"
version = "0.1.0"
edition = "2024"
description = "Diagnose protocol, schema, and runtime failures in MCP servers"
license = "MIT"
repository = "https://github.com/EnjoyableWork/mcp-doctor"
homepage = "https://github.com/EnjoyableWork/mcp-doctor"
readme = "README.md"
keywords = ["mcp", "testing", "diagnostics", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "/.github/workflows/*.yml",
    "/src/**",
    "/tests/**",
    "/scripts/**",
    "/docs/**",
    "/AGENTS.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/PROJECT.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/LICENSE",
    "/README.md",
    "/deny.toml",
    "/rust-toolchain.toml",
]

[features]
internal-test-fixtures = []

[[bin]]
name = "mcp-doctor"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
jsonschema = { version = "=0.49.9", default-features = false }
process-wrap = { version = "=9.1.0", default-features = false, features = [
    "job-object",
    "kill-on-drop",
    "process-group",
    "tokio1",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "time",
] }

[dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "mcp-doctor-stdio-fixture"
path = "tests/fixtures/stdio_server.rs"
required-features = ["internal-test-fixtures"]
test = false
bench = false
doc = false
