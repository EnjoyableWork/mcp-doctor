name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject generated executables and unreviewable binary artifacts
        run: ./scripts/verify-source-artifacts.sh --worktree

      - name: Rehearse non-disclosing organization-control verification
        run: ./scripts/rehearse-organization-controls.sh

      - name: Resolve the exact locked dependency and feature graph
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 >/dev/null
          cargo tree \
            --workspace \
            --all-features \
            --locked \
            --edges features \
            --no-dedupe >/dev/null
          cargo test --locked --test dependency_policy

      - name: Install the reviewed cargo-deny executable by exact digest
        run: ./scripts/install-cargo-deny.sh "$RUNNER_TEMP/mcp-doctor-tools"

      - name: Check advisories, licenses, bans, and sources
        run: >-
          "$RUNNER_TEMP/mcp-doctor-tools/cargo-deny"
          --all-features --locked check

  unix-quality:
    name: ${{ matrix.name }} — format, Clippy, and test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GNU/Linux x64
            runner: ubuntu-24.04
            rust_host: x86_64-unknown-linux-gnu
          - name: macOS ARM64
            runner: macos-15
            rust_host: aarch64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report the selected Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Verify the native Rust host
        env:
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          set -euo pipefail
          actual_rust_host="$(rustc --version --verbose | sed -n 's/^host: //p')"
          test "$actual_rust_host" = "$EXPECTED_RUST_HOST"

      - name: Run quality gates through a disposable environment
        run: ./scripts/check.sh

  windows-quality:
    name: Windows x64 — format, Clippy, and test
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report the selected Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Verify the native Rust host
        shell: pwsh
        env:
          EXPECTED_RUST_HOST: x86_64-pc-windows-msvc
        run: |
          $actualRustHost = (rustc --version --verbose | Select-String '^host: ').Line.Substring(6)
          if ($actualRustHost -ne $env:EXPECTED_RUST_HOST) {
              throw "Expected Rust host $env:EXPECTED_RUST_HOST but found $actualRustHost"
          }

      - name: Run quality gates through a disposable environment
        shell: pwsh
        run: ./scripts/check.ps1

  required-ci:
    name: Required CI
    if: always()
    needs:
      - dependencies
      - unix-quality
      - windows-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every CI dependency to succeed
        env:
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          UNIX_QUALITY_RESULT: ${{ needs.unix-quality.result }}
          WINDOWS_QUALITY_RESULT: ${{ needs.windows-quality.result }}
        run: |
          test "$DEPENDENCIES_RESULT" = success
          test "$UNIX_QUALITY_RESULT" = success
          test "$WINDOWS_QUALITY_RESULT" = success
