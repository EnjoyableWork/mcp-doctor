name: Compatibility evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  current-revision:
    name: Pinned current-revision servers
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report the selected environment
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
          docker version

      - name: Inspect pinned official and independent servers
        run: ./scripts/compatibility.sh
