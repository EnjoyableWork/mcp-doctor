name: Verify crates.io workflow authorization boundary

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-authorization-negative
  cancel-in-progress: false

jobs:
  reject:
    name: Reject OIDC from the wrong workflow identity
    if: github.repository == 'EnjoyableWork/mcp-doctor'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
      url: https://crates.io/crates/mcp-doctor
    permissions:
      id-token: write

    steps:
      - name: Attempt authentication from an unauthorized workflow
        id: denied_auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Require crates.io to reject the workflow identity
        env:
          AUTH_OUTCOME: ${{ steps.denied_auth.outcome }}
        run: |
          set -euo pipefail
          if [[ "$AUTH_OUTCOME" != failure ]]; then
            echo "crates.io accepted OIDC from an unauthorized workflow" >&2
            exit 1
          fi
          echo "crates.io rejected the unauthorized workflow identity." >>"$GITHUB_STEP_SUMMARY"
